name: Execution intent finalization repair v2

on:
  push:
    paths:
      - "INTENT_FINALIZATION_V2_TRIGGER.txt"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and verify
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          path = Path('execution/execution_engine.py')
          text = path.read_text(encoding='utf-8')
          start_marker = '        # Initialize futures settings on first order if applicable\n'
          end_marker = '        params: dict[str, Any] = {\'clientOrderId\': client_order_id}\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('place_order pre-submit section anchors missing')
          section = text[start:end]

          lines = section.splitlines(keepends=True)
          out = []
          i = 0
          patched = 0
          while i < len(lines):
              line = lines[i]
              if 'return ExecutionResult(' not in line:
                  out.append(line)
                  i += 1
                  continue

              # Convert the current pre-submit return into a named result so the
              # durable intent is finalized before the method returns.
              indent = line[:len(line) - len(line.lstrip())]
              if 'return ExecutionResult(' not in line:
                  out.append(line)
                  i += 1
                  continue
              out.append(line.replace('return ExecutionResult(', 'result = ExecutionResult(', 1))
              balance = line.count('(') - line.count(')')
              i += 1
              while i < len(lines):
                  body_line = lines[i]
                  out.append(body_line)
                  balance += body_line.count('(') - body_line.count(')')
                  i += 1
                  if balance == 0:
                      out.append(f'{indent}self.intent_journal.result(result)\n')
                      out.append(f'{indent}return result\n')
                      patched += 1
                      break
              else:
                  raise SystemExit('Unbalanced ExecutionResult block')

          section_new = ''.join(out)
          text = text[:start] + section_new + text[end:]
          path.write_text(text, encoding='utf-8')
          ast.parse(text)

          if patched != 6:
              raise SystemExit(f'Expected 6 pre-submit intent-finalization paths, patched {patched}')
          print('Intent finalization patch + AST regression check PASSED')
          PY

      - name: Commit patch and cleanup
        run: |
          rm -f INTENT_FINALIZATION_V2_TRIGGER.txt .github/workflows/repair_intent_finalization_v2.yml .github/workflows/repair_intent_finalization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add execution/execution_engine.py INTENT_FINALIZATION_V2_TRIGGER.txt .github/workflows/repair_intent_finalization_v2.yml .github/workflows/repair_intent_finalization.yml
          git commit -m "fix: finalize durable intents on pre-submit rejection"
          git push origin HEAD:main
