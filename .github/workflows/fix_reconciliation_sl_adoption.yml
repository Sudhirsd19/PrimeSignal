name: Fix reconciliation protective SL adoption

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix_reconciliation_sl_adoption.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch and test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('core/reconciliation_engine.py')
          text = p.read_text(encoding='utf-8')

          old = '''    async def _sync_exchange_orders(self, symbol: str, ctx, exchange_qty: float, open_orders: list) -> Optional[str]:
          exec_engine = self.bot.execution
          protective_orders = []
          for o in open_orders:
              o_id = str(o.get('id', ''))
              if not o_id:
                  continue
              typ = str(o.get('type', '')).lower()
              if typ in ('stop_market', 'stop', 'stop_loss_limit', 'stop_limit'):
                  protective_orders.append(o)

          local_sl = ctx.native_sl_order_id
          resolved_sl = None
          if exchange_qty < 0.0001:
              for o in protective_orders:
                  o_id = str(o.get('id', ''))
                  try:
                      print(f'[RECONCILIATION] Flat position - cancelling orphaned SL: {o_id}')
                  except Exception:
                      pass
                  await exec_engine.cancel_order_safe(symbol, o_id)
              return None

          if protective_orders:
              matched = [o for o in protective_orders if str(o.get('id', '')) == str(local_sl)]
              if matched:
                  resolved_sl = str(matched[0].get('id'))
              else:
                  resolved_sl = str(protective_orders[-1].get('id'))
                  try:
                      print(f'[RECONCILIATION] Discovered existing exchange SL {resolved_sl} for {symbol}. Adopting.')
                  except Exception:
                      pass
                  ctx.native_sl_order_id = resolved_sl
              for o in protective_orders:
                  o_id = str(o.get('id', ''))
                  if o_id != resolved_sl:
                      try:
                          print(f'[RECONCILIATION] Cancelling duplicate protective order: {o_id}')
                      except Exception:
                          pass
                      await exec_engine.cancel_order_safe(symbol, o_id)
          return resolved_sl
'''

          new = '''    async def _sync_exchange_orders(self, symbol: str, ctx, exchange_qty: float, open_orders: list) -> Optional[str]:
          exec_engine = self.bot.execution
          self._protective_order_ambiguous = False
          protective_orders = []
          for o in open_orders:
              o_id = str(o.get('id', ''))
              if not o_id:
                  continue
              typ = str(o.get('type', '')).lower()
              if typ in ('stop_market', 'stop', 'stop_loss_limit', 'stop_limit'):
                  protective_orders.append(o)

          local_sl = str(ctx.native_sl_order_id or '')
          resolved_sl = None
          if exchange_qty < 0.0001:
              for o in protective_orders:
                  o_id = str(o.get('id', ''))
                  try:
                      print(f'[RECONCILIATION] Flat position - cancelling orphaned SL: {o_id}')
                  except Exception:
                      pass
                  await exec_engine.cancel_order_safe(symbol, o_id)
              return None

          if not protective_orders:
              return None

          position_side = str(getattr(ctx, 'side', '') or self.bot.position_side.get(symbol, '')).upper()
          expected_sl_side = 'sell' if position_side == 'LONG' else 'buy' if position_side == 'SHORT' else None

          if local_sl:
              matched = [o for o in protective_orders if str(o.get('id', '')) == local_sl]
              if len(matched) != 1:
                  self.safe_mode_active = True
                  self._protective_order_ambiguous = True
                  ctx.native_sl_order_id = None
                  print(f'[RECONCILIATION CRITICAL] {symbol}: local Native SL {local_sl} is not uniquely present on exchange. Refusing arbitrary SL adoption; SAFE MODE ACTIVATED.')
                  return None
              candidate = matched[0]
              candidate_side = str(candidate.get('side', '')).lower()
              if expected_sl_side and candidate_side and candidate_side != expected_sl_side:
                  self.safe_mode_active = True
                  self._protective_order_ambiguous = True
                  ctx.native_sl_order_id = None
                  print(f'[RECONCILIATION CRITICAL] {symbol}: local Native SL {local_sl} has wrong side {candidate_side!r}; refusing it as protection. SAFE MODE ACTIVATED.')
                  return None
              resolved_sl = str(candidate.get('id'))
          else:
              candidates = protective_orders
              if expected_sl_side:
                  candidates = [o for o in protective_orders if str(o.get('side', '')).lower() == expected_sl_side]
              if len(candidates) != 1:
                  self.safe_mode_active = True
                  self._protective_order_ambiguous = True
                  print(f'[RECONCILIATION CRITICAL] {symbol}: {len(candidates)} plausible protective orders found with no durable SL identity. Refusing arbitrary adoption; leaving exchange orders untouched and activating SAFE MODE.')
                  return None
              resolved_sl = str(candidates[0].get('id'))
              ctx.native_sl_order_id = resolved_sl
              try:
                  print(f'[RECONCILIATION] Discovered unique side-matched exchange SL {resolved_sl} for {symbol}. Adopting.')
              except Exception:
                  pass

          for o in protective_orders:
              o_id = str(o.get('id', ''))
              if o_id != resolved_sl:
                  try:
                      print(f'[RECONCILIATION] Cancelling duplicate protective order: {o_id}')
                  except Exception:
                      pass
                  await exec_engine.cancel_order_safe(symbol, o_id)
          return resolved_sl
'''

          if old not in text:
              raise SystemExit('Expected _sync_exchange_orders block not found; aborting without changes.')
          text = text.replace(old, new, 1)

          old_futures = '''                resolved_sl = await self._sync_exchange_orders(symbol, ctx, contracts, symbol_orders)
                if resolved_sl:
                    ctx.native_sl_order_id = resolved_sl

                if contracts > 1e-05 and exchange_pos is not None:
'''
          new_futures = '''                resolved_sl = await self._sync_exchange_orders(symbol, ctx, contracts, symbol_orders)
                if getattr(self, '_protective_order_ambiguous', False):
                    self.bot.save_state()
                    continue
                if resolved_sl:
                    ctx.native_sl_order_id = resolved_sl

                if contracts > 1e-05 and exchange_pos is not None:
'''
          if old_futures not in text:
              raise SystemExit('Expected futures reconciliation call-site not found; aborting without changes.')
          text = text.replace(old_futures, new_futures, 1)

          old_spot = '''                resolved_sl = await self._sync_exchange_orders(symbol, ctx, base_qty, symbol_orders)
                if resolved_sl:
                    ctx.native_sl_order_id = resolved_sl
                if self.bot.in_position.get(symbol, False):
'''
          new_spot = '''                resolved_sl = await self._sync_exchange_orders(symbol, ctx, base_qty, symbol_orders)
                if getattr(self, '_protective_order_ambiguous', False):
                    self.bot.save_state()
                    continue
                if resolved_sl:
                    ctx.native_sl_order_id = resolved_sl
                if self.bot.in_position.get(symbol, False):
'''
          if old_spot not in text:
              raise SystemExit('Expected spot reconciliation call-site not found; aborting without changes.')
          text = text.replace(old_spot, new_spot, 1)

          p.write_text(text, encoding='utf-8')
          PY

          python -m py_compile core/reconciliation_engine.py

          python - <<'PY'
          import asyncio
          import ast
          from pathlib import Path

          src = Path('core/reconciliation_engine.py').read_text(encoding='utf-8')
          tree = ast.parse(src)
          fn = next(n for n in ast.walk(tree) if isinstance(n, ast.AsyncFunctionDef) and n.name == '_sync_exchange_orders')
          segment = ast.get_source_segment(src, fn)
          assert 'Refusing arbitrary SL adoption' in segment
          assert 'len(candidates) != 1' in segment
          assert '_protective_order_ambiguous' in segment
          assert 'protective_orders[-1]' not in segment
          print('PASS: reconciliation protective SL matching is fail-closed and no longer adopts arbitrary last order.')
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/reconciliation_engine.py
          git diff --cached --quiet && echo 'No changes to commit.' && exit 0
          git commit -m 'fix: fail closed on ambiguous reconciliation SL adoption'
          git push
