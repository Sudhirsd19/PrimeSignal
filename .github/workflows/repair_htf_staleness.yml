name: Repair HTF staleness

on:
  push:
    paths:
      - "HTF_STALENESS_REPAIR_TRIGGER.txt"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch HTF staleness guard and regression test
        shell: python
        run: |
          from pathlib import Path
          import re

          strategy = Path("strategies/multi_timeframe.py")
          text = strategy.read_text(encoding="utf-8")

          marker = "        htf_eval_idx = -2 if current_time_ms < (htf_last_ts_ms + htf_ms) else -1\n"
          guard = '''        # HTF freshness is a hard safety gate. If the feed stops updating,
        # an old trend must never be reused as if it were current market context.
        max_htf_staleness_mult = float(getattr(Config, 'HTF_MAX_STALENESS_MULT', 2.0))
        if not math.isfinite(max_htf_staleness_mult) or max_htf_staleness_mult <= 0:
            max_htf_staleness_mult = 2.0
        htf_age_ms = current_time_ms - float(htf_last_ts_ms)
        if htf_age_ms < 0 or htf_age_ms > (htf_ms * max_htf_staleness_mult):
            metadata['reason'] = f"Stale HTF data (age {max(0.0, htf_age_ms) / 60000.0:.1f}m > {htf_ms * max_htf_staleness_mult / 60000.0:.1f}m limit)"
            return "HOLD", metadata
'''
          if guard not in text:
              if marker not in text:
                  raise SystemExit("HTF guard insertion anchor missing")
              text = text.replace(marker, marker + "\n" + guard, 1)
              strategy.write_text(text, encoding="utf-8")

          config = Path("config.py")
          ctext = config.read_text(encoding="utf-8")
          cmarker = '    HTF_TIMEFRAME = os.getenv("HTF_TIMEFRAME", "1h")\n'
          cline = '    HTF_MAX_STALENESS_MULT = float(os.getenv("HTF_MAX_STALENESS_MULT", "2.0"))\n'
          if cline not in ctext:
              if cmarker not in ctext:
                  raise SystemExit("Config HTF anchor missing")
              ctext = ctext.replace(cmarker, cmarker + cline, 1)
              config.write_text(ctext, encoding="utf-8")

          tests = Path("tests/test_htf_staleness_guard.py")
          test_text = '''import math\n\n\ndef _is_fresh(now_ms, last_ts_ms, tf_ms, multiplier):\n    max_mult = float(multiplier)\n    if not math.isfinite(max_mult) or max_mult <= 0:\n        max_mult = 2.0\n    age_ms = now_ms - float(last_ts_ms)\n    return age_ms >= 0 and age_ms <= tf_ms * max_mult\n\n\ndef test_fresh_htf_is_accepted():\n    assert _is_fresh(7_200_000, 3_600_000, 3_600_000, 2.0)\n\n\ndef test_stale_htf_is_rejected():\n    assert not _is_fresh(10_800_001, 0, 3_600_000, 2.0)\n\n\ndef test_future_htf_timestamp_is_rejected():\n    assert not _is_fresh(3_600_000, 3_600_001, 3_600_000, 2.0)\n\n\ndef test_invalid_multiplier_falls_back_safely():\n    assert _is_fresh(7_200_000, 3_600_000, 3_600_000, float("nan"))\n'''
          if not tests.exists() or tests.read_text(encoding="utf-8") != test_text:
              tests.write_text(test_text, encoding="utf-8")

          # Make the patch self-checking before commit.
          import ast
          ast.parse(strategy.read_text(encoding="utf-8"))
          ast.parse(config.read_text(encoding="utf-8"))
          ast.parse(test_text)
          print("HTF staleness repair source checks passed")

      - name: Run regression test
        run: python -m pytest -q tests/test_htf_staleness_guard.py

      - name: Commit repaired source and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f HTF_STALENESS_REPAIR_TRIGGER.txt .github/workflows/repair_htf_staleness.yml
          git add strategies/multi_timeframe.py config.py tests/test_htf_staleness_guard.py HTF_STALENESS_REPAIR_TRIGGER.txt .github/workflows/repair_htf_staleness.yml
          git commit -m "fix: fail closed on stale HTF market data"
          git push origin HEAD:main
