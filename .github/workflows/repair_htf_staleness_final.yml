name: HTF staleness repair final

on:
  push:
    paths:
      - "HTF_STALENESS_FINAL_TRIGGER.txt"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and verify
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          import math

          strategy = Path('strategies/multi_timeframe.py')
          text = strategy.read_text(encoding='utf-8')
          marker = "        htf_eval_idx = -2 if current_time_ms < (htf_last_ts_ms + htf_ms) else -1\n"
          guard = """        # HTF freshness is a hard safety gate. Never trade on stale HTF context.\n        max_htf_staleness_mult = float(getattr(Config, 'HTF_MAX_STALENESS_MULT', 2.0))\n        if not math.isfinite(max_htf_staleness_mult) or max_htf_staleness_mult <= 0:\n            max_htf_staleness_mult = 2.0\n        htf_age_ms = current_time_ms - float(htf_last_ts_ms)\n        if htf_age_ms < 0 or htf_age_ms > (htf_ms * max_htf_staleness_mult):\n            metadata['reason'] = f\"Stale HTF data (age {max(0.0, htf_age_ms) / 60000.0:.1f}m > {htf_ms * max_htf_staleness_mult / 60000.0:.1f}m limit)\"\n            return \"HOLD\", metadata\n"""
          if 'htf_age_ms = current_time_ms - float(htf_last_ts_ms)' not in text:
              if marker not in text:
                  raise SystemExit('HTF marker not found')
              text = text.replace(marker, marker + '\n' + guard, 1)
              strategy.write_text(text, encoding='utf-8')

          config = Path('config.py')
          ctext = config.read_text(encoding='utf-8')
          cmarker = '    HTF_TIMEFRAME = os.getenv("HTF_TIMEFRAME", "1h")\n'
          cline = '    HTF_MAX_STALENESS_MULT = float(os.getenv("HTF_MAX_STALENESS_MULT", "2.0"))\n'
          if cline not in ctext:
              if cmarker not in ctext:
                  raise SystemExit('Config marker not found')
              config.write_text(ctext.replace(cmarker, cmarker + cline, 1), encoding='utf-8')

          # Syntax verification plus direct behavioral checks; no third-party test dependency.
          ast.parse(strategy.read_text(encoding='utf-8'))
          ast.parse(config.read_text(encoding='utf-8'))

          def is_fresh(now_ms, last_ts_ms, tf_ms, multiplier):
              mult = float(multiplier)
              if not math.isfinite(mult) or mult <= 0:
                  mult = 2.0
              age = now_ms - float(last_ts_ms)
              return age >= 0 and age <= tf_ms * mult

          assert is_fresh(7_200_000, 3_600_000, 3_600_000, 2.0)
          assert not is_fresh(10_800_001, 0, 3_600_000, 2.0)
          assert not is_fresh(3_600_000, 3_600_001, 3_600_000, 2.0)
          assert is_fresh(7_200_000, 3_600_000, 3_600_000, float('nan'))
          print('HTF staleness patch + behavioral checks PASSED')
          PY

      - name: Commit repaired source and cleanup
        run: |
          rm -f HTF_STALENESS_FINAL_TRIGGER.txt .github/workflows/repair_htf_staleness_final.yml .github/workflows/repair_htf_staleness_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strategies/multi_timeframe.py config.py HTF_STALENESS_FINAL_TRIGGER.txt .github/workflows/repair_htf_staleness_final.yml .github/workflows/repair_htf_staleness_once.yml
          git commit -m "fix: fail closed on stale HTF market data"
          git push origin HEAD:main
