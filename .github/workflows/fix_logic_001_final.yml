name: Logic 001 final recovery protection

on:
  push:
    branches: [fix/logic-bugs-sequential]
    paths:
      - '.github/workflows/fix_logic_001_final.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/logic-bugs-sequential
          fetch-depth: 0

      - name: Apply LOGIC-001 recovery safety fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('core/reconciliation_engine.py')
          text = path.read_text(encoding='utf-8')

          old = """                                sl_dist = 0.02
                                fee_adj = fill_p * getattr(Config, 'FEE_RATE', 0.00075) * 2.0
                                if pos_side == 'LONG':
                                    sl_price = fill_p * (1.0 - sl_dist)
                                    r_amt = abs(fill_p - sl_price)
                                    tp1 = fill_p + 1.0 * r_amt + fee_adj
                                    tp2 = fill_p + 2.2 * r_amt + fee_adj
                                    tp3 = fill_p + 4.0 * r_amt + fee_adj
                                else:
                                    sl_price = fill_p * (1.0 + sl_dist)
                                    r_amt = abs(fill_p - sl_price)
                                    tp1 = fill_p - 1.0 * r_amt - fee_adj
                                    tp2 = fill_p - 2.2 * r_amt - fee_adj
                                    tp3 = fill_p - 4.0 * r_amt - fee_adj

"""

          new = """                                # LOGIC-001: Never invent a synthetic recovery SL after restart.
                                protection = raw_meta.get('protection') if isinstance(raw_meta.get('protection'), dict) else {}
                                try:
                                    sl_price = float(protection.get('stop_loss', 0.0))
                                except (TypeError, ValueError):
                                    sl_price = 0.0
                                if sl_price <= 0.0:
                                    self.safe_mode_active = True
                                    ctx.transition_to(
                                        OrderState.EXECUTION_UNKNOWN,
                                        reason='Recovered ENTRY fill without durable strategy stop-loss',
                                    )
                                    print(
                                        f'[RECONCILIATION CRITICAL] ENTRY {i_id} for {symbol} has no durable strategy SL; '
                                        'recovery quarantined in SAFE MODE; no 2% fallback permitted.'
                                    )
                                    continue

                                fee_adj = fill_p * getattr(Config, 'FEE_RATE', 0.00075) * 2.0
                                r_amt = abs(fill_p - sl_price)
                                if r_amt <= 0.0:
                                    self.safe_mode_active = True
                                    ctx.transition_to(
                                        OrderState.EXECUTION_UNKNOWN,
                                        reason='Recovered ENTRY has invalid non-positive stop distance',
                                    )
                                    continue
                                if pos_side == 'LONG':
                                    tp1 = fill_p + 1.0 * r_amt + fee_adj
                                    tp2 = fill_p + 2.2 * r_amt + fee_adj
                                    tp3 = fill_p + 4.0 * r_amt + fee_adj
                                else:
                                    tp1 = fill_p - 1.0 * r_amt - fee_adj
                                    tp2 = fill_p - 2.2 * r_amt - fee_adj
                                    tp3 = fill_p - 4.0 * r_amt - fee_adj

"""

          if old not in text:
              raise SystemExit('LOGIC-001 target block not found; refusing unsafe modification')
          if 'sl_dist = 0.02' not in text:
              raise SystemExit('LOGIC-001 target already absent; no automatic mutation performed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('LOGIC-001 patch applied to reconciliation_engine.py')
          PY

      - name: Verify syntax and safety invariants
        shell: bash
        run: |
          python -m py_compile core/reconciliation_engine.py
          python - <<'PY'
          from pathlib import Path
          source = Path('core/reconciliation_engine.py').read_text(encoding='utf-8')
          assert 'sl_dist = 0.02' not in source
          assert "protection.get('stop_loss'" in source
          assert 'Recovered ENTRY fill without durable strategy stop-loss' in source
          assert 'no 2% fallback permitted' in source
          print('LOGIC-001 PASS')
          PY

      - name: Commit only after verification passes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/reconciliation_engine.py
          git commit -m 'fix: fail closed on crash recovery without durable stop loss'
          git push origin fix/logic-bugs-sequential
