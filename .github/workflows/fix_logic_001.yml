name: Fix LOGIC-001 durable strategy SL

on:
  push:
    branches:
      - fix/logic-001-durable-sl

permissions:
  contents: write

jobs:
  repair-and-test:
    if: github.event.head_commit.message != 'fix: persist durable strategy stop loss'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch LOGIC-001
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_exact(path, old, new, label):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {n}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print(f'PATCHED: {label}')

          # 1) Carry the actual strategy protection in the durable execution intent.
          replace_exact(
              'execution/execution_engine.py',
              '''        is_exit_order: bool = False,\n    ) -> tuple[str, str]:''',
              '''        is_exit_order: bool = False,\n        protection: dict[str, Any] | None = None,\n    ) -> tuple[str, str]:''',
              'prepare_order_intent signature',
          )

          replace_exact(
              'execution/execution_engine.py',
              '''            price=price,\n        )\n        return intent_id, client_order_id''',
              '''            price=price,\n            protection=protection,\n        )\n        return intent_id, client_order_id''',
              'journal protection persistence',
          )

          replace_exact(
              'execution/execution_engine.py',
              '''                          intent_id=None, client_order_id=None):''',
              '''                          intent_id=None, client_order_id=None, protection=None):''',
              'place_order signature',
          )

          replace_exact(
              'execution/execution_engine.py',
              '''                client_order_id=client_order_id,\n                is_exit_order=is_exit_order,\n            )''',
              '''                client_order_id=client_order_id,\n                is_exit_order=is_exit_order,\n                protection=protection,\n            )''',
              'place_order protection forwarding',
          )

          # 2) Replay must expose the durable protection metadata to reconciliation.
          replace_exact(
              'execution/execution_engine.py',
              '''                discovered.raw['price'] = price\n                discovered.intent_id = intent_id''',
              '''                discovered.raw['price'] = price\n                discovered.raw['protection'] = dict(intent.get('protection') or {})\n                discovered.intent_id = intent_id''',
              'replay protection metadata',
          )

          replace_exact(
              'execution/execution_engine.py',
              '''                    raw={'order_role': order_role, 'symbol': symbol, 'side': side, 'price': price}\n                )''',
              '''                    raw={\n                        'order_role': order_role,\n                        'symbol': symbol,\n                        'side': side,\n                        'price': price,\n                        'protection': dict(intent.get('protection') or {}),\n                    }\n                )''',
              'rejected replay protection metadata',
          )

          # 3) Entries persist the strategy-calculated SL and position side.
          replace_exact(
              'main.py',
              '''                        order = await self.execution.place_order('buy', 'market', pos_size, price=entry_price, symbol=symbol)''',
              '''                        order = await self.execution.place_order(\n                            'buy', 'market', pos_size, price=entry_price, symbol=symbol,\n                            order_role='ENTRY',\n                            protection={\n                                'stop_loss': float(sl),\n                                'signal_entry_price': float(entry_price),\n                                'position_side': 'LONG',\n                            },\n                        )''',
              'BUY durable protection',
          )

          replace_exact(
              'main.py',
              '''                        order = await self.execution.place_order('sell', 'market', pos_size, price=entry_price, symbol=symbol)''',
              '''                        order = await self.execution.place_order(\n                            'sell', 'market', pos_size, price=entry_price, symbol=symbol,\n                            order_role='ENTRY',\n                            protection={\n                                'stop_loss': float(sl),\n                                'signal_entry_price': float(entry_price),\n                                'position_side': 'SHORT',\n                            },\n                        )''',
              'SELL durable protection',
          )

          # 4) Crash recovery must never invent a 2% stop. Missing/invalid durable
          # protection is quarantined in SAFE MODE instead.
          replace_exact(
              'core/reconciliation_engine.py',
              '''                                sl_dist = 0.02\n                                fee_adj = fill_p * getattr(Config, 'FEE_RATE', 0.00075) * 2.0\n                                if pos_side == 'LONG':\n                                    sl_price = fill_p * (1.0 - sl_dist)\n                                    r_amt = abs(fill_p - sl_price)\n                                    tp1 = fill_p + 1.0 * r_amt + fee_adj\n                                    tp2 = fill_p + 2.2 * r_amt + fee_adj\n                                    tp3 = fill_p + 4.0 * r_amt + fee_adj\n                                else:\n                                    sl_price = fill_p * (1.0 + sl_dist)\n                                    r_amt = abs(fill_p - sl_price)\n                                    tp1 = fill_p - 1.0 * r_amt - fee_adj\n                                    tp2 = fill_p - 2.2 * r_amt - fee_adj\n                                    tp3 = fill_p - 4.0 * r_amt - fee_adj\n''',
              '''                                protection = raw_meta.get('protection') if isinstance(raw_meta.get('protection'), dict) else {}\n                                try:\n                                    sl_price = float(protection.get('stop_loss', 0.0))\n                                except (TypeError, ValueError):\n                                    sl_price = 0.0\n\n                                if sl_price <= 0.0:\n                                    self.safe_mode_active = True\n                                    ctx.transition_to(\n                                        OrderState.EXECUTION_UNKNOWN,\n                                        reason='Recovered ENTRY fill without durable strategy stop-loss',\n                                    )\n                                    print(\n                                        f'[RECONCILIATION CRITICAL] ENTRY {i_id} for {symbol} has no durable strategy SL; '\n                                        'recovery quarantined in SAFE MODE; no 2% fallback permitted.'\n                                    )\n                                    continue\n\n                                fee_adj = fill_p * getattr(Config, 'FEE_RATE', 0.00075) * 2.0\n                                r_amt = abs(fill_p - sl_price)\n                                if r_amt <= 0.0:\n                                    self.safe_mode_active = True\n                                    ctx.transition_to(\n                                        OrderState.EXECUTION_UNKNOWN,\n                                        reason='Recovered ENTRY has invalid non-positive stop distance',\n                                    )\n                                    continue\n\n                                if pos_side == 'LONG':\n                                    tp1 = fill_p + 1.0 * r_amt + fee_adj\n                                    tp2 = fill_p + 2.2 * r_amt + fee_adj\n                                    tp3 = fill_p + 4.0 * r_amt + fee_adj\n                                else:\n                                    tp1 = fill_p - 1.0 * r_amt - fee_adj\n                                    tp2 = fill_p - 2.2 * r_amt - fee_adj\n                                    tp3 = fill_p - 4.0 * r_amt - fee_adj\n''',
              'startup recovery hard-coded SL',
          )

          # Add a lightweight source invariant test file so CI can prove the repair.
          test_path = Path('tests/test_logic_001_durable_sl.py')
          test_path.write_text('''from pathlib import Path\n\n\ndef test_logic_001_no_hardcoded_startup_stop_and_protection_is_durable():\n    recon = Path("core/reconciliation_engine.py").read_text(encoding="utf-8")\n    engine = Path("execution/execution_engine.py").read_text(encoding="utf-8")\n    main = Path("main.py").read_text(encoding="utf-8")\n\n    assert "sl_dist = 0.02" not in recon\n    assert "protection.get('stop_loss'" in recon\n    assert "protection: dict[str, Any] | None = None" in engine\n    assert "protection=protection" in engine\n    assert "'position_side': 'LONG'" in main\n    assert "'position_side': 'SHORT'" in main\n''', encoding='utf-8')
          PY

      - name: Compile changed Python files
        run: |
          python -m py_compile main.py execution/execution_engine.py execution/execution_result.py core/reconciliation_engine.py

      - name: Run tests
        run: python -m pytest -q

      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/reconciliation_engine.py execution/execution_engine.py main.py tests/test_logic_001_durable_sl.py
          git diff --cached --check
          git commit -m "fix: persist durable strategy stop loss"
          git push origin HEAD:fix/logic-001-durable-sl
