name: Fix live entry protection wiring

on:
  push:
    paths:
      - '.github/workflows/fix_live_protection_wiring.yml'
      - 'LIVE_PROTECTION_FIX_TRIGGER.txt'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/logic-001-complete
          fetch-depth: 0

      - name: Apply deterministic protection wiring
        shell: python
        run: |
          from pathlib import Path

          # ExecutionEngine: carry durable protection into the intent journal.
          engine = Path('execution/execution_engine.py')
          text = engine.read_text(encoding='utf-8')

          old = '''        is_exit_order: bool = False,\n    ) -> tuple[str, str]:'''
          new = '''        is_exit_order: bool = False,\n        protection: Optional[dict[str, Any]] = None,\n    ) -> tuple[str, str]:'''
          if 'protection: Optional[dict[str, Any]] = None' not in text:
              if old not in text:
                  raise SystemExit('engine: prepare_order_intent signature anchor not found')
              text = text.replace(old, new, 1)

          old = '''            order_role=order_role,\n            price=price,\n        )'''
          new = '''            order_role=order_role,\n            price=price,\n            protection=protection,\n        )'''
          if 'protection=protection,\n        )' not in text:
              if old not in text:
                  raise SystemExit('engine: journal.create anchor not found')
              text = text.replace(old, new, 1)

          old = '''                          order_role="ENTRY", candle_ts=None,\n                          intent_id=None, client_order_id=None):'''
          new = '''                          order_role="ENTRY", candle_ts=None,\n                          intent_id=None, client_order_id=None, protection=None):'''
          if 'client_order_id=None, protection=None' not in text:
              if old not in text:
                  raise SystemExit('engine: place_order signature anchor not found')
              text = text.replace(old, new, 1)

          old = '''                is_exit_order=is_exit_order,\n            )'''
          new = '''                is_exit_order=is_exit_order,\n                protection=protection,\n            )'''
          if 'protection=protection,\n            )' not in text:
              if old not in text:
                  raise SystemExit('engine: prepare_order_intent call anchor not found')
              text = text.replace(old, new, 1)

          engine.write_text(text, encoding='utf-8')

          # main.py is the active entrypoint. Its _patch_source() transforms
          # main_legacy.py at runtime, so add the protection wiring inside that
          # transformation rather than editing the copied legacy implementation.
          wrapper = Path('main.py')
          text = wrapper.read_text(encoding='utf-8')

          marker = '''    return text\n\n\ndef _load_patched_legacy():'''
          injection = '''    # Live ENTRY durable protection: the legacy source must pass the exact\n    # strategy stop and position side into ExecutionEngine before journaling.\n    buy_call = "order = await self.execution.place_order('buy', 'market', pos_size, price=entry_price, symbol=symbol)"\n    buy_call_new = "order = await self.execution.place_order('buy', 'market', pos_size, price=entry_price, symbol=symbol, order_role='ENTRY', protection={\\\"stop_loss\\\": sl, \\\"position_side\\\": \\\"LONG\\\", \\\"signal_entry_price\\\": entry_price})"\n    sell_call = "order = await self.execution.place_order('sell', 'market', pos_size, price=entry_price, symbol=symbol)"\n    sell_call_new = "order = await self.execution.place_order('sell', 'market', pos_size, price=entry_price, symbol=symbol, order_role='ENTRY', protection={\\\"stop_loss\\\": sl, \\\"position_side\\\": \\\"SHORT\\\", \\\"signal_entry_price\\\": entry_price})"\n    text = _replace_once(text, buy_call, buy_call_new, "live BUY protection")\n    text = _replace_once(text, sell_call, sell_call_new, "live SELL protection")\n\n    return text\n\n\ndef _load_patched_legacy():'''
          if 'live BUY protection' not in text:
              if marker not in text:
                  raise SystemExit('wrapper: _patch_source return anchor not found')
              text = text.replace(marker, injection, 1)

          wrapper.write_text(text, encoding='utf-8')

      - name: Verify actual source hardening
        run: |
          python -m py_compile execution/execution_engine.py main.py main_legacy.py
          grep -n "protection: Optional" execution/execution_engine.py
          grep -n "protection=protection" execution/execution_engine.py
          grep -n "live BUY protection\|live SELL protection" main.py

      - name: Commit actual fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add execution/execution_engine.py main.py
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: wire durable protection into live entry intents"
          git push origin HEAD:fix/logic-001-complete
