name: PrimeSignal one-week backtest

on:
  workflow_dispatch:
  push:
    branches:
      - fix/logic-001-complete

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/logic-001-complete

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Download fresh 30-day market data
        run: python fetch_30d.py

      - name: Run exact 7-day backtest
        run: python backtest_1week.py | tee one_week_backtest_result.txt

      - name: Upload result and market data
        uses: actions/upload-artifact@v4
        with:
          name: primesignal-one-week-backtest
          path: |
            one_week_backtest_result.txt
            htf_data.json
            ltf_data.json
          if-no-files-found: error
