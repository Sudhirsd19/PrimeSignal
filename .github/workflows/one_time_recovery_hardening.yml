name: PrimeSignal LOGIC-001 recovery hardening

on:
  push:
    branches: [main]
    paths:
      - 'LOGIC_001_TRIGGER.txt'

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply only the LOGIC-001 recovery safety fix
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('core/reconciliation_engine.py')
          s = p.read_text(encoding='utf-8')

          old = """                                sl_dist = 0.02
                                fee_adj = fill_p * getattr(Config, 'FEE_RATE', 0.00075) * 2.0
                                if pos_side == 'LONG':
                                    sl_price = fill_p * (1.0 - sl_dist)
                                    r_amt = abs(fill_p - sl_price)
                                    tp1 = fill_p + 1.0 * r_amt + fee_adj
                                    tp2 = fill_p + 2.2 * r_amt + fee_adj
                                    tp3 = fill_p + 4.0 * r_amt + fee_adj
                                else:
                                    sl_price = fill_p * (1.0 + sl_dist)
                                    r_amt = abs(fill_p - sl_price)
                                    tp1 = fill_p - 1.0 * r_amt - fee_adj
                                    tp2 = fill_p - 2.2 * r_amt - fee_adj
                                    tp3 = fill_p - 4.0 * r_amt - fee_adj

"""
          new = """                                # LOGIC-001: A crash-recovered fill must never receive an invented 2% SL.
                                # Until the original strategy protection is durably available, quarantine the position.
                                protection = raw_meta.get('protection') if isinstance(raw_meta.get('protection'), dict) else {}
                                try:
                                    sl_price = float(protection.get('stop_loss', 0.0))
                                except (TypeError, ValueError):
                                    sl_price = 0.0
                                if sl_price <= 0.0:
                                    self.safe_mode_active = True
                                    ctx.transition_to(
                                        OrderState.EXECUTION_UNKNOWN,
                                        reason='Recovered ENTRY fill without durable strategy stop-loss',
                                    )
                                    print(
                                        f'[RECONCILIATION CRITICAL] ENTRY {i_id} for {symbol} has no durable strategy SL; '
                                        'recovery quarantined in SAFE MODE; no 2% fallback permitted.'
                                    )
                                    continue

                                fee_adj = fill_p * getattr(Config, 'FEE_RATE', 0.00075) * 2.0
                                r_amt = abs(fill_p - sl_price)
                                if r_amt <= 0.0:
                                    self.safe_mode_active = True
                                    ctx.transition_to(
                                        OrderState.EXECUTION_UNKNOWN,
                                        reason='Recovered ENTRY has invalid non-positive stop distance',
                                    )
                                    continue
                                if pos_side == 'LONG':
                                    tp1 = fill_p + 1.0 * r_amt + fee_adj
                                    tp2 = fill_p + 2.2 * r_amt + fee_adj
                                    tp3 = fill_p + 4.0 * r_amt + fee_adj
                                else:
                                    tp1 = fill_p - 1.0 * r_amt - fee_adj
                                    tp2 = fill_p - 2.2 * r_amt - fee_adj
                                    tp3 = fill_p - 4.0 * r_amt - fee_adj

"""
          if s.count(old) != 1:
              raise SystemExit(f'LOGIC-001 target count must be 1, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          print('LOGIC-001 source patch applied')
          PY

      - name: Compile and regression-test the repaired path
        run: |
          python -m py_compile core/reconciliation_engine.py
          python - <<'PY'
          from pathlib import Path
          s = Path('core/reconciliation_engine.py').read_text(encoding='utf-8')
          assert 'sl_dist = 0.02' not in s
          assert "protection.get('stop_loss'" in s
          assert 'Recovered ENTRY fill without durable strategy stop-loss' in s
          assert 'no 2% fallback permitted' in s
          print('LOGIC-001 regression: PASS')
          PY

      - name: Commit only after tests pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/reconciliation_engine.py
          git commit -m 'fix: fail closed on crash recovery without durable stop loss'
          git push origin main
