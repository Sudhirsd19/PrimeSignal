name: Complete LOGIC-001 durability

on:
  push:
    branches: [fix/logic-001-complete]

permissions:
  contents: write

jobs:
  harden-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch durable protection path
        shell: python
        run: |
          from pathlib import Path

          def repl(path, old, new, count=1):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if s.count(old) < count:
                  raise SystemExit(f'PATCH FAILED: {path}: expected {count} occurrence(s), found {s.count(old)}')
              s = s.replace(old, new, count)
              p.write_text(s, encoding='utf-8')

          # execution/execution_engine.py: accept and journal strategy protection.
          repl('execution/execution_engine.py',
               '        is_exit_order: bool = False,\n    ) -> tuple[str, str]:',
               '        is_exit_order: bool = False,\n        protection: dict[str, Any] | None = None,\n    ) -> tuple[str, str]:')
          repl('execution/execution_engine.py',
               '            order_role=order_role,\n            price=price,\n        )',
               '            order_role=order_role,\n            price=price,\n            protection=protection,\n        )')
          repl('execution/execution_engine.py',
               '                          intent_id=None, client_order_id=None):',
               '                          intent_id=None, client_order_id=None, protection=None):')
          repl('execution/execution_engine.py',
               '                client_order_id=client_order_id,\n                is_exit_order=is_exit_order,\n            )',
               '                client_order_id=client_order_id,\n                is_exit_order=is_exit_order,\n                protection=protection,\n            )')

          # Replay must carry original protection metadata into reconciliation.
          repl('execution/execution_engine.py',
               "                discovered.raw['price'] = price\n                discovered.intent_id = intent_id",
               "                discovered.raw['price'] = price\n                discovered.raw['protection'] = dict(intent.get('protection') or {})\n                discovered.intent_id = intent_id", 1)
          repl('execution/execution_engine.py',
               "                discovered.raw['price'] = price\n                discovered.intent_id = intent_id",
               "                discovered.raw['protection'] = dict(intent.get('protection') or {})\n                discovered.intent_id = intent_id", 1)
          repl('execution/execution_engine.py',
               "                    raw={'order_role': order_role, 'symbol': symbol, 'side': side, 'price': price}",
               "                    raw={'order_role': order_role, 'symbol': symbol, 'side': side, 'price': price, 'protection': dict(intent.get('protection') or {})}")

          # main.py: durable SL is attached to every live ENTRY intent.
          repl('main.py',
               "order = await self.execution.place_order('buy', 'market', pos_size, price=entry_price, symbol=symbol)",
               "order = await self.execution.place_order(\n                            'buy', 'market', pos_size, price=entry_price, symbol=symbol,\n                            order_role='ENTRY',\n                            protection={'stop_loss': float(sl), 'signal_entry_price': float(entry_price), 'position_side': 'LONG'},\n                        )")
          repl('main.py',
               "order = await self.execution.place_order('sell', 'market', pos_size, price=entry_price, symbol=symbol)",
               "order = await self.execution.place_order(\n                            'sell', 'market', pos_size, price=entry_price, symbol=symbol,\n                            order_role='ENTRY',\n                            protection={'stop_loss': float(sl), 'signal_entry_price': float(entry_price), 'position_side': 'SHORT'},\n                        )")

          # Replace the earlier overly-optimistic static test with direct invariants.
          Path('tests/test_logic_001_durable_sl.py').write_text('''from pathlib import Path\n\n\ndef test_logic_001_durable_sl_end_to_end_contract():\n    recon = Path("core/reconciliation_engine.py").read_text(encoding="utf-8")\n    engine = Path("execution/execution_engine.py").read_text(encoding="utf-8")\n    main = Path("main.py").read_text(encoding="utf-8")\n    journal = Path("execution/execution_result.py").read_text(encoding="utf-8")\n\n    assert "sl_dist = 0.02" not in recon\n    assert "protection.get('stop_loss'" in recon\n    assert "protection=protection" in engine\n    assert "protection: Optional[dict[str, Any]] = None" in journal\n    assert "discovered.raw['protection'] = dict(intent.get('protection') or {})" in engine\n    assert "'position_side': 'LONG'" in main\n    assert "'position_side': 'SHORT'" in main\n    assert "'stop_loss': float(sl)" in main\n''', encoding='utf-8')

      - name: Compile and regression test
        run: |
          python -m compileall -q execution core main.py tests/test_logic_001_durable_sl.py
          python -m pytest -q tests/test_logic_001_durable_sl.py

      - name: Commit hardened code and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add execution/execution_engine.py main.py tests/test_logic_001_durable_sl.py .github/workflows/complete_logic_001.yml
          git rm -f .github/workflows/complete_logic_001.yml
          git commit -m "fix: make strategy stop loss durable across restart recovery"
          git push
