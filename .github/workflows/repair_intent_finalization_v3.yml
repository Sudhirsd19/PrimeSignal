name: Execution intent finalization repair v3

on:
  push:
    paths:
      - "INTENT_FINALIZATION_V3_TRIGGER.txt"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and verify
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          path = Path('execution/execution_engine.py')
          text = path.read_text(encoding='utf-8')

          # Section 1: all pre-submit rejection paths before params.
          start_marker = '        # Initialize futures settings on first order if applicable\n'
          end_marker = "        params: dict[str, Any] = {'clientOrderId': client_order_id}\n"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('pre-submit section anchors missing')
          section = text[start:end]
          lines = section.splitlines(keepends=True)
          out = []
          i = 0
          patched = 0
          while i < len(lines):
              line = lines[i]
              if 'return ExecutionResult(' not in line:
                  out.append(line)
                  i += 1
                  continue
              indent = line[:len(line) - len(line.lstrip())]
              out.append(line.replace('return ExecutionResult(', 'result = ExecutionResult(', 1))
              balance = line.count('(') - line.count(')')
              i += 1
              while i < len(lines):
                  body = lines[i]
                  out.append(body)
                  balance += body.count('(') - body.count(')')
                  i += 1
                  if balance == 0:
                      out.append(f'{indent}self.intent_journal.result(result)\n')
                      out.append(f'{indent}return result\n')
                      patched += 1
                      break
              else:
                  raise SystemExit('unbalanced ExecutionResult block in pre-submit section')
          if patched != 5:
              raise SystemExit(f'Expected 5 pre-submit paths, patched {patched}')
          text = text[:start] + ''.join(out) + text[end:]

          # Section 2: LIMIT-without-price is after params and must also close the intent.
          limit_old = '''                return ExecutionResult(\n                    state=ExecutionState.NOT_SUBMITTED,\n                    requested_qty=float(amount),\n                    client_order_id=client_order_id,\n                    intent_id=intent_id,\n                    venue="BINANCE",\n                    error="limit order requires price",\n                )'''
          limit_new = '''                result = ExecutionResult(\n                    state=ExecutionState.NOT_SUBMITTED,\n                    requested_qty=float(amount),\n                    client_order_id=client_order_id,\n                    intent_id=intent_id,\n                    venue="BINANCE",\n                    error="limit order requires price",\n                )\n                self.intent_journal.result(result)\n                return result'''
          if text.count(limit_old) != 1:
              raise SystemExit(f'Limit-path anchor mismatch: found {text.count(limit_old)}')
          text = text.replace(limit_old, limit_new, 1)

          path.write_text(text, encoding='utf-8')
          ast.parse(text)

          # Static safety assertions for all six paths.
          for marker in (
              'error=f"Futures leverage/margin configuration failed: {e}"',
              'error="below exchange minimum"',
              'error="ticker unavailable"',
              'error="slippage limit exceeded"',
              'error="limit order requires price"',
          ):
              first = text.find(marker)
              if first < 0:
                  raise SystemExit(f'Missing marker: {marker}')
              block = text[first:first+900]
              if 'self.intent_journal.result(result)' not in block:
                  raise SystemExit(f'Intent finalization not found near: {marker}')
          if text.count('error="slippage limit exceeded"') != 2:
              raise SystemExit('Expected two slippage rejection paths')
          print('Execution intent finalization v3 patch + AST/static checks PASSED')
          PY

      - name: Commit patch and cleanup
        run: |
          rm -f INTENT_FINALIZATION_V3_TRIGGER.txt .github/workflows/repair_intent_finalization_v3.yml .github/workflows/repair_intent_finalization_v2.yml .github/workflows/repair_intent_finalization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add execution/execution_engine.py INTENT_FINALIZATION_V3_TRIGGER.txt .github/workflows/repair_intent_finalization_v3.yml .github/workflows/repair_intent_finalization_v2.yml .github/workflows/repair_intent_finalization.yml
          git commit -m "fix: finalize durable intents on all pre-submit rejections"
          git push origin HEAD:main
