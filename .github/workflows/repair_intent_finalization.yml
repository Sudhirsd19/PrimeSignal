name: Execution intent finalization repair

on:
  push:
    paths:
      - "INTENT_FINALIZATION_REPAIR_TRIGGER.txt"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and verify execution intent finalization
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          path = Path('execution/execution_engine.py')
          text = path.read_text(encoding='utf-8')

          # Every result produced after an intent has been durably created must
          # close that intent before returning. Otherwise startup reconciliation
          # can repeatedly see a phantom unresolved order that was never sent.
          replacements = [
              (
                  '''                result = ExecutionResult(\n                    state=ExecutionState.REJECTED,\n                    requested_qty=float(amount or 0.0),\n                    client_order_id=client_order_id,\n                    intent_id=intent_id,\n                    venue="BINANCE",\n                    error=f"Futures leverage/margin configuration failed: {e}"\n                )\n                return result''',
                  '''                result = ExecutionResult(\n                    state=ExecutionState.REJECTED,\n                    requested_qty=float(amount or 0.0),\n                    client_order_id=client_order_id,\n                    intent_id=intent_id,\n                    venue="BINANCE",\n                    error=f"Futures leverage/margin configuration failed: {e}"\n                )\n                self.intent_journal.result(result)\n                return result''',
              ),
              (
                  '''                    return ExecutionResult(\n                        state=ExecutionState.REJECTED,\n                        requested_qty=float(amount),\n                        client_order_id=client_order_id,\n                        intent_id=intent_id,\n                        venue="BINANCE",\n                        error="below exchange minimum",\n                    )''',
                  '''                    result = ExecutionResult(\n                        state=ExecutionState.REJECTED,\n                        requested_qty=float(amount),\n                        client_order_id=client_order_id,\n                        intent_id=intent_id,\n                        venue="BINANCE",\n                        error="below exchange minimum",\n                    )\n                    self.intent_journal.result(result)\n                    return result''',
              ),
              (
                  '''                return ExecutionResult(\n                    state=ExecutionState.NOT_SUBMITTED,\n                    requested_qty=float(amount),\n                    client_order_id=client_order_id,\n                    intent_id=intent_id,\n                    venue="BINANCE",\n                    error="ticker unavailable",\n                )''',
                  '''                result = ExecutionResult(\n                    state=ExecutionState.NOT_SUBMITTED,\n                    requested_qty=float(amount),\n                    client_order_id=client_order_id,\n                    intent_id=intent_id,\n                    venue="BINANCE",\n                    error="ticker unavailable",\n                )\n                self.intent_journal.result(result)\n                return result''',
              ),
              (
                  '''                        return ExecutionResult(\n                            state=ExecutionState.NOT_SUBMITTED,\n                            requested_qty=float(amount),\n                            client_order_id=client_order_id,\n                            intent_id=intent_id,\n                            venue="BINANCE",\n                            error="slippage limit exceeded",\n                        )''',
                  '''                        result = ExecutionResult(\n                            state=ExecutionState.NOT_SUBMITTED,\n                            requested_qty=float(amount),\n                            client_order_id=client_order_id,\n                            intent_id=intent_id,\n                            venue="BINANCE",\n                            error="slippage limit exceeded",\n                        )\n                        self.intent_journal.result(result)\n                        return result''',
              ),
              (
                  '''                    return ExecutionResult(\n                        state=ExecutionState.NOT_SUBMITTED,\n                        requested_qty=float(amount),\n                        client_order_id=client_order_id,\n                        intent_id=intent_id,\n                        venue="BINANCE",\n                        error="limit order requires price",\n                    )''',
                  '''                    result = ExecutionResult(\n                        state=ExecutionState.NOT_SUBMITTED,\n                        requested_qty=float(amount),\n                        client_order_id=client_order_id,\n                        intent_id=intent_id,\n                        venue="BINANCE",\n                        error="limit order requires price",\n                    )\n                    self.intent_journal.result(result)\n                    return result''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Execution intent anchor mismatch: expected 1, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          ast.parse(text)

          # Dependency-free regression: each targeted pre-submit error path must
          # now finalize the durable intent before returning.
          required = [
              'error=f"Futures leverage/margin configuration failed: {e}"',
              'error="below exchange minimum"',
              'error="ticker unavailable"',
              'error="slippage limit exceeded"',
              'error="limit order requires price"',
          ]
          for marker in required:
              pos = text.find(marker)
              if pos < 0:
                  raise SystemExit(f'Missing marker after patch: {marker}')
              block = text[pos:pos+900]
              if 'self.intent_journal.result(result)' not in block:
                  raise SystemExit(f'Intent finalization missing near {marker}')

          print('Execution intent finalization patch + regression checks PASSED')
          PY

      - name: Commit patch and cleanup
        run: |
          rm -f INTENT_FINALIZATION_REPAIR_TRIGGER.txt .github/workflows/repair_intent_finalization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add execution/execution_engine.py INTENT_FINALIZATION_REPAIR_TRIGGER.txt .github/workflows/repair_intent_finalization.yml
          git commit -m "fix: finalize durable intents on pre-submit rejection"
          git push origin HEAD:main
